<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchBuzz: Home</title>
    <style>
        body { font-family: Arial, sans-serif; background: #E8F5E9; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header h2 { margin: 0; color: #1A237E; font-size: 20px; }
        .search-box { display: flex; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 14px; border: none; border-radius: 8px 0 0 8px; outline: none; font-size: 15px; }
        .search-box button { background: #1A237E; color: white; border: none; padding: 0 25px; border-radius: 0 8px 8px 0; font-weight: bold; cursor: pointer; }
        #matchListContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: #1A237E; font-size: 17px; }
        .card p { margin: 0; color: #555; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>LIVE & RECENT MATCHES</h2>
        <button onclick="location.reload()" style="background:#1A237E; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer;">🔄</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search tournament or match..." onkeyup="filterMatches()">
        <button>Search</button>
    </div>

    <div id="matchListContainer">
        <div style="text-align: center; color: #666; padding: 20px; grid-column: 1 / -1;">Loading...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMDdv0RET-RWY7M6uV376S1EI6CoPTY2o",
        authDomain: "cricket-scoring-a.firebaseapp.com",
        databaseURL: "https://cricket-scoring-a-default-rtdb.firebaseio.com",
        projectId: "cricket-scoring-a",
        storageBucket: "cricket-scoring-a.firebasestorage.app",
        messagingSenderId: "695009872829",
        appId: "1:695009872829:web:80a58e4841761bdcc3e0d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allItems = [];

    const dbRef = ref(db);
    onValue(dbRef, (snapshot) => {
        allItems = [];
        if (snapshot.exists()) {
            let rootData = snapshot.val();

            if (rootData.MatchBuzz && rootData.MatchBuzz.SingleMatches) {
                let singles = rootData.MatchBuzz.SingleMatches;
                Object.keys(singles).forEach(key => {
                    let match = singles[key];
                    let isLive = match.isLive === true || match.isLive === "true";
                    if (isLive) {
                        allItems.push({
                            title: `🏏 ${(match.match_name || 'SINGLE MATCH').toUpperCase()} (${match.match_id || key})`,
                            sub: `Score: 0/0 | Batting: ${match.team1 || 'Team A'}`,
                            searchKey: `${match.match_name} ${match.match_id} ${match.team1} ${match.team2}`.toLowerCase(),
                            action: () => {
                                window.location.href = `score.html?single=${key}`;
                            }
                        });
                    }
                });
            }

            if (rootData.Tournaments) {
                let tournaments = rootData.Tournaments;
                Object.keys(tournaments).forEach(tourKey => {
                    if (tourKey.startsWith("Tour_")) {
                        let tour = tournaments[tourKey];
                        let isLive = tour.isLive === true || tour.isLive === "true";
                        if (isLive) {
                            let tName = tour.T_Name || tourKey;
                            let tId = tourKey.replace("Tour_", "");
                            
                            allItems.push({
                                title: `🏆 ${tName.toUpperCase()} (${tId})`,
                                sub: "Tournament in Progress - Click to continue",
                                searchKey: `${tName} ${tId}`.toLowerCase(),
                                action: () => {
                                    let matches = tour.Matches || {};
                                    
                                    let r16Done = true;
                                    for (let i = 0; i < 8; i++) {
                                        let m = matches[`Match_${i}`] || {};
                                        if (!m.Winner && !m.IsOver) {
                                            r16Done = false;
                                            break;
                                        }
                                    }
                                    if (!r16Done) {
                                        window.location.href = `round16.html?tour=${tourKey}`;
                                        return;
                                    }

                                    let qfDone = true;
                                    for (let i = 0; i < 4; i++) {
                                        let m = matches[`Match_${100 + i}`] || {};
                                        let qfWinner = tour[`QuarterFinal_Winner_${i}`] || m.Winner;
                                        if (!qfWinner && !m.IsOver) {
                                            qfDone = false;
                                            break;
                                        }
                                    }
                                    if (!qfDone) {
                                        window.location.href = `quater.html?tour=${tourKey}`;
                                        return;
                                    }

                                    let sfDone = true;
                                    for (let i = 0; i < 2; i++) {
                                        let m = matches[`Match_${200 + i}`] || {};
                                        let sfWinner = tour[`SemiFinal_Winner_${i}`] || m.Winner;
                                        if (!sfWinner && !m.IsOver) {
                                            sfDone = false;
                                            break;
                                        }
                                    }
                                    if (!sfDone) {
                                        window.location.href = `semi.html?tour=${tourKey}`;
                                        return;
                                    }

                                    window.location.href = `final.html?tour=${tourKey}`;
                                }
                            });
                        }
                    }
                });
            }
        }
        renderList(allItems);
    });

    window.renderList = function(list) {
        const container = document.getElementById('matchListContainer');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#78909C; padding:20px; grid-column: 1 / -1;">No live matches available right now.</div>';
            return;
        }

        list.forEach(item => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${item.title}</h3><p>${item.sub}</p>`;
            card.onclick = item.action;
            container.appendChild(card);
        });
    }

    window.filterMatches = function() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allItems.filter(item => item.searchKey.includes(query));
        renderList(filtered);
    }
</script>

</body>
</html>
