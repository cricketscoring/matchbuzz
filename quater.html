<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchBuzz: Quarter Finals - Live Matches</title>
    <style>
        body { font-family: Arial, sans-serif; background: #E0F2F1; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; padding-bottom: 30px; }
        .back-btn { background: transparent; color: #00695C; border: none; font-size: 26px; font-weight: bold; cursor: pointer; margin-left: -5px; margin-bottom: 10px; }
        .tour-banner { background: #1A237E; border: 3px solid #3F51B5; border-radius: 16px; padding: 25px 30px; text-align: center; margin-bottom: 20px; grid-column: 1 / -1; }
        .tour-banner h2 { margin: 0; color: #FFFFFF; font-size: 21px; }
        .page-title { text-align: center; color: #00695C; font-size: 22px; font-weight: bold; margin-bottom: 20px; grid-column: 1 / -1; }
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #FFFFFF; border: 2px solid #00897B; border-radius: 16px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .match-title { color: #00695C; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .winner-banner { background: linear-gradient(to right, #FF8F00, #FFD54F); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .winner-label { color: #3E2723; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .winner-name { color: #1A237E; font-size: 20px; font-weight: bold; margin: 0; }
        .team-box { background: #E0F2F1; border: 1px solid #80CBC4; border-radius: 12px; padding: 15px; text-align: center; color: #1A237E; font-size: 18px; font-weight: bold; margin: 5px 0; }
        .vs-text { text-align: center; color: #D32F2F; font-size: 13px; font-weight: bold; margin: 5px 0; }
        .action-btn { width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 13px; font-weight: bold; color: #FFFFFF; cursor: pointer; margin-top: 15px; }
        .next-btn { grid-column: 1 / -1; width: 100%; border: none; border-radius: 16px; padding: 25px; font-size: 15px; font-weight: bold; color: #FFFFFF; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div style="text-align: center; color: #666; padding: 40px; grid-column: 1 / -1;">Loading Quarter Finals...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMDdv0RET-RWY7M6uV376S1EI6CoPTY2o",
        authDomain: "cricket-scoring-a.firebaseapp.com",
        databaseURL: "https://cricket-scoring-a-default-rtdb.firebaseio.com",
        projectId: "cricket-scoring-a",
        storageBucket: "cricket-scoring-a.firebasestorage.app",
        messagingSenderId: "695009872829",
        appId: "1:695009872829:web:80a58e4841761bdcc3e0d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const tourKey = urlParams.get('tour') || 'Tour_0';

    const tourRef = ref(db, `Tournaments/${tourKey}`);
    onValue(tourRef, (snapshot) => {
        const container = document.getElementById('mainContainer');
        container.innerHTML = '';

        let tName = "TOURNAMENT";
        let matches = {};
        let qfWinners = {};

        if (snapshot.exists()) {
            let data = snapshot.val();
            tName = data.T_Name || tourKey;
            matches = data.Matches || {};
            for (let k = 0; k < 4; k++) {
                if (data[`QuarterFinal_Winner_${k}`]) {
                    qfWinners[k] = data[`QuarterFinal_Winner_${k}`];
                }
            }
        }

        let btnBack = document.createElement('button');
        btnBack.className = 'back-btn';
        btnBack.innerHTML = '← Back';
        btnBack.onclick = () => window.location.href = `round16.html?tour=${tourKey}`;
        container.appendChild(btnBack);

        let tourBanner = document.createElement('div');
        tourBanner.className = 'tour-banner';
        tourBanner.innerHTML = `<h2>${tName.toUpperCase()}</h2>`;
        container.appendChild(tourBanner);

        let pageTitle = document.createElement('div');
        pageTitle.className = 'page-title';
        pageTitle.innerHTML = 'QUARTER FINAL - LIVE MATCHES';
        container.appendChild(pageTitle);

        let gridContainer = document.createElement('div');
        gridContainer.className = 'matches-grid';

        let allQFDone = true;

        for (let i = 0; i < 4; i++) {
            let realMatchIndex = 100 + i;
            let matchKey = "Match_" + realMatchIndex;
            let mData = matches[matchKey] || {};
            let team1 = mData.Team1 || "TBD";
            let team2 = mData.Team2 || "TBD";
            let winner = qfWinners[i] || mData.Winner || "";
            let isOver = mData.IsOver || false;

            if (!winner && !isOver) {
                allQFDone = false;
            }

            let card = document.createElement('div');
            card.className = 'card';

            let cardHtml = `<div class="match-title">Match ${i + 1}</div>`;

            if (winner) {
                cardHtml += `
                    <div class="winner-banner">
                        <div class="winner-label">🏆 WINNER 🏆</div>
                        <h2 class="winner-name">${winner}</h2>
                    </div>
                `;
            }

            cardHtml += `
                <div>
                    <div class="team-box">${team1}</div>
                    <div class="vs-text">Vs</div>
                    <div class="team-box">${team2}</div>
                </div>
            `;

            let btnBg = '#78909C';
            let btnText = 'ENTER SCORE BOARD (Not started)';
            if (winner || isOver) {
                btnBg = '#00796B';
                btnText = 'MATCH SUMMARY';
            } else if (mData.Runs !== undefined || mData.BatTeam) {
                btnBg = '#C2185B';
                btnText = 'WATCH LIVE';
            }

            cardHtml += `<button class="action-btn" style="background: ${btnBg};">${btnText}</button>`;
            card.innerHTML = cardHtml;

            card.querySelector('.action-btn').onclick = () => {
                window.location.href = `score.html?tour=${tourKey}&match=${realMatchIndex}&stage=Quarter Final Match`;
            };

            gridContainer.appendChild(card);
        }

        container.appendChild(gridContainer);

        let btnNextRound = document.createElement('button');
        btnNextRound.className = 'next-btn';
        btnNextRound.style.background = allQFDone ? '#00796B' : '#546E7A';
        btnNextRound.innerHTML = allQFDone ? '➡️ Proceed to Semi-Finals' : '🔒 Proceed to Semi-Finals (Complete all matches)';
        
        btnNextRound.onclick = () => {
            if (allQFDone) {
                window.location.href = `semi.html?tour=${tourKey}`;
            } else {
                alert('Please finish all matches in this round!');
            }
        };

        container.appendChild(btnNextRound);
    });
</script>

</body>
</html>
