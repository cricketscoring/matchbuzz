<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MatchBuzz: Live Scoreboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #E8F5E9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #FFFFFF; border-radius: 16px; padding: 15px 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        
        :fullscreen .container {
            max-width: 100% !important;
            width: 100% !important;
            height: 100vh !important;
            border-radius: 0 !important;
            padding: 20px 40px !important;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: 15px;
            margin: 0 !important;
        }

        .top-card { background: linear-gradient(to bottom, #1B5E20, #2E7D32); border-radius: 12px; padding: 12px; text-align: center; color: #FFFFFF; margin-bottom: 0; }
        .top-card h3 { margin: 0 0 3px 0; font-size: 20px; color: #C8E6C9; }
        .top-card h1 { margin: 0; font-size: 30px; }
        
        .score-card { background: linear-gradient(to bottom, #1A237E, #3F51B5); border-radius: 12px; padding: 20px 25px; color: #FFFFFF; margin-bottom: 0; }
        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 40px; font-weight: bold; }
        .batting-team { color: #FFCC80; }
        .bowling-team { color: #C5CAE9; }
        .vs-text { color: #C5CAE9; font-size: 32px; }
        
        .run-layout { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .score-number { font-size: 115px; font-weight: bold; line-height: 1; }
        .right-stats { text-align: right; }
        .overs-text { font-size: 44px; font-weight: bold; color: #E8EAF6; }
        .crr-text { font-size: 30px; color: #B2DFDB; }
        .target-text { font-size: 32px; font-weight: bold; color: #FFCC80; margin-bottom: 4px; }
        
        .over-balls-row { display: flex; align-items: center; margin-bottom: 15px; }
        .over-label { color: #FFCC80; font-size: 26px; font-weight: bold; margin-right: 15px; }
        .balls-container { display: flex; gap: 10px; overflow-x: auto; }
        .ball-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 22px; font-weight: bold; flex-shrink: 0; }
        
        .divider { height: 3px; background: #5C6BC0; margin: 15px 0; }
        
        .info-layout { display: flex; justify-content: space-between; font-size: 36px; margin-bottom: 15px; }
        .bowler-info { text-align: right; color: #FFEB3B; }
        
        .requirement-bar { background: #FFECB3; color: #1A237E; padding: 15px; border-radius: 10px; text-align: center; font-size: 34px; font-weight: bold; margin-bottom: 5px; display: none; white-space: pre-line; }
        
        .button-row { display: flex; gap: 10px; margin-top: 0; }
        .action-btn { flex: 1; padding: 14px 10px; border: none; border-radius: 12px; font-size: 12px; font-weight: bold; color: #FFFFFF; cursor: pointer; text-align: center; }
        .btn-scorecard { background: #0F172A; }
        .btn-fullscreen { background: #1E293B; }
        .btn-back { background: #047857; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="top-card">
        <h3 id="stageTitle">★ MATCH ★</h3>
        <h1 id="tourName">LOADING...</h1>
    </div>

    <div class="score-card">
        <div class="teams-row">
            <div class="batting-team" id="batTeamName">TEAM A</div>
            <div class="vs-text">VS</div>
            <div class="bowling-team" id="bowlTeamName">TEAM B</div>
        </div>

        <div class="run-layout">
            <div class="score-number">
                <span id="runsVal">0</span>/<span id="wicketsVal">0</span>
            </div>
            <div class="right-stats">
                <div class="target-text" id="targetBar" style="display: none;">Target: 0</div>
                <div class="overs-text" id="oversVal">Overs: 0.0 / 20</div>
                <div class="crr-text" id="crrVal">CRR: 0.00</div>
            </div>
        </div>

        <div class="over-balls-row">
            <div class="over-label">This Over:</div>
            <div class="balls-container" id="ballsContainer"></div>
        </div>

        <div class="divider"></div>

        <div class="info-layout">
            <div id="battersInfo">• Batter 1 - 0(0)<br>• Batter 2 - 0(0)</div>
            <div class="bowler-info" id="bowlerInfo">Bowler:<br>Bowler Name (0.0-0)</div>
        </div>

        <div class="requirement-bar" id="reqBar"></div>
    </div>

    <div class="button-row">
        <button class="action-btn btn-scorecard" id="scorecardBtn">Scorecard</button>
        <button class="action-btn btn-fullscreen" id="fullscreenBtn">Full screen mode</button>
        <button class="action-btn btn-back" id="backBtn">Back to tournament</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMDdv0RET-RWY7M6uV376S1EI6CoPTY2o",
        authDomain: "cricket-scoring-a.firebaseapp.com",
        databaseURL: "https://cricket-scoring-a-default-rtdb.firebaseio.com",
        projectId: "cricket-scoring-a",
        storageBucket: "cricket-scoring-a.firebasestorage.app",
        messagingSenderId: "695009872829",
        appId: "1:695009872829:web:80a58e4841761bdcc3e0d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const singleId = urlParams.get('single');
    const tourKey = urlParams.get('tour');
    const matchIndex = urlParams.get('match');
    const stageName = urlParams.get('stage');

    if (stageName) {
        document.getElementById('stageTitle').innerText = `★ ${stageName.toUpperCase()} ★`;
    } else if (singleId) {
        document.getElementById('stageTitle').innerText = `★ SINGLE MATCH ★`;
    }

    const scorecardBtn = document.getElementById('scorecardBtn');
    if (singleId) {
        scorecardBtn.style.display = 'none';
    } else {
        scorecardBtn.onclick = () => {
            window.location.href = `scorecard.html?tour=${tourKey}&match=${matchIndex}${stageName ? '&stage=' + encodeURIComponent(stageName) : ''}`;
        };
    }

    const backBtn = document.getElementById('backBtn');
    if (singleId) {
        backBtn.onclick = () => window.location.href = 'index.html';
        backBtn.innerText = 'Back to Home';
    } else {
        let mIdx = parseInt(matchIndex) || 0;
        let targetPage = 'round16.html';
        let pageTitleText = 'Back to Round of 16';

        if (mIdx >= 300) {
            targetPage = 'final.html';
            pageTitleText = 'Back to Grand Final';
        } else if (mIdx >= 200) {
            targetPage = 'semi.html';
            pageTitleText = 'Back to Semi-Finals';
        } else if (mIdx >= 100) {
            targetPage = 'quater.html';
            pageTitleText = 'Back to Quarter-Finals';
        } else {
            targetPage = 'round16.html';
            pageTitleText = 'Back to Round of 16';
        }

        backBtn.onclick = () => window.location.href = `${targetPage}?tour=${tourKey}`;
        backBtn.innerText = pageTitleText;
    }

    const fsBtn = document.getElementById('fullscreenBtn');
    if (fsBtn) {
        fsBtn.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        };

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsBtn.innerText = 'Minimize screen';
            } else {
                fsBtn.innerText = 'Full screen mode';
            }
        });
    }

    if (singleId) {
        const singleRef = ref(db, `MatchBuzz/SingleMatches/${singleId}`);
        onValue(singleRef, (snapshot) => {
            if (snapshot.exists()) {
                let matchData = snapshot.val();
                let mName = matchData.match_name || 'SINGLE MATCH';
                let mId = matchData.match_id || singleId;
                document.getElementById('tourName').innerText = `${mName.toUpperCase()} (${mId})`;

                updateScoreboardUI(matchData, null);
            }
        });
    } else if (tourKey && matchIndex !== null) {
        const tourRef = ref(db, `Tournaments/${tourKey}`);
        onValue(tourRef, (snapshot) => {
            if (snapshot.exists()) {
                let data = snapshot.val();
                let tName = data.T_Name || tourKey;
                document.getElementById('tourName').innerText = tName.toUpperCase();

                let matchData = data.Matches && data.Matches[`Match_${matchIndex}`] ? data.Matches[`Match_${matchIndex}`] : {};
                updateScoreboardUI(matchData, data);
            } else {
                updateScoreboardUI({}, data);
            }
        });
    }

    function updateScoreboardUI(matchData, tourData) {
        let runs = matchData.Runs || 0;
        let wickets = matchData.Wickets || 0;
        let balls = matchData.Balls || 0;
        let overs = matchData.Overs !== undefined ? matchData.Overs : 0;
        let maxOvers = matchData.OversLimit || matchData.oversLimit || "20";
        let innings = matchData.Innings || 1;
        let target = matchData.Target || 0;

        let defaultT1 = "Team A";
        let defaultT2 = "Team B";
        let mIdx = parseInt(matchIndex) || 0;

        if (tourData) {
            if (mIdx >= 300) {
                defaultT1 = tourData.SemiFinal_Winner_0 || "Team A";
                defaultT2 = tourData.SemiFinal_Winner_1 || "Team B";
            } else if (mIdx >= 200) {
                let sfIndex = mIdx - 200;
                defaultT1 = tourData[`QuarterFinal_Winner_${sfIndex * 2}`] || "Team A";
                defaultT2 = tourData[`QuarterFinal_Winner_${sfIndex * 2 + 1}`] || "Team B";
            }
        }

        let team1 = matchData.Team1 || defaultT1;
        let team2 = matchData.Team2 || defaultT2;
        let batTeam = matchData.BatTeam || team1;
        let bowlTeam = batTeam === team1 ? team2 : team1;

        document.getElementById('batTeamName').innerText = batTeam.toUpperCase();
        document.getElementById('bowlTeamName').innerText = bowlTeam.toUpperCase();
        document.getElementById('runsVal').innerText = runs;
        document.getElementById('wicketsVal').innerText = wickets;
        document.getElementById('oversVal').innerText = `Overs: ${overs}.${balls} / ${maxOvers}`;

        let totalOversDecimal = overs + (balls / 6.0);
        let crr = totalOversDecimal > 0 ? (runs / totalOversDecimal) : 0.0;
        document.getElementById('crrVal').innerText = `CRR: ${crr.toFixed(2)}`;

        let isOver = matchData.IsOver || false;
        let i1Ended = matchData.I1Ended || false;
        let resultMsg = matchData.ResultMsg || matchData.Winner || "";

        let reqBar = document.getElementById('reqBar');
        let targetBar = document.getElementById('targetBar');

        let maxOvInt = parseInt(maxOvers) || 20;
        let totalBallsAllowed = maxOvInt * 6;
        let ballsBowled = (overs * 6) + balls;

        if (runs === 0 && wickets === 0 && overs === 0 && balls === 0 && innings === 1 && target === 0 && !i1Ended && !isOver) {
            targetBar.style.display = 'none';
            reqBar.style.display = 'none';
        } else if (isOver) {
            targetBar.style.display = 'block';
            targetBar.innerText = `Target: ${target}`;
            reqBar.style.display = 'block';
            reqBar.innerText = resultMsg || "Match Over";
        } else if (i1Ended) {
            let currentTarget = target > 0 ? target : (runs + 1);
            targetBar.style.display = 'block';
            targetBar.innerText = `Target: ${currentTarget}`;
            reqBar.style.display = 'block';
            reqBar.innerText = `★ INNINGS BREAK ★\nTarget: ${currentTarget} Runs`;
        } else if (innings >= 2) {
            let currentTarget = target > 0 ? target : 0;
            let ballsRemaining = totalBallsAllowed - ballsBowled;
            if (ballsRemaining < 0) ballsRemaining = 0;
            let runsNeeded = currentTarget - runs;
            if (runsNeeded < 0) runsNeeded = 0;

            targetBar.style.display = 'block';
            targetBar.innerText = `Target: ${currentTarget}`;
            reqBar.style.display = 'block';
            reqBar.innerText = `Need ${runsNeeded} runs in ${ballsRemaining} balls`;
        } else {
            targetBar.style.display = 'none';
            reqBar.style.display = 'none';
        }

        let striker = matchData.Striker || "Batter 1";
        let nonStriker = matchData.NonStriker || "Batter 2";
        let isS1Striker = matchData.IsStrikerS1 !== false;
        let bowler = matchData.Bowler || "Bowler Name";

        let batStats = matchData.BatsmanStats || {};
        let s1Runs = batStats[striker] ? (batStats[striker].Runs || 0) : 0;
        let s1Balls = batStats[striker] ? (batStats[striker].Balls || 0) : 0;
        let s2Runs = batStats[nonStriker] ? (batStats[nonStriker].Runs || 0) : 0;
        let s2Balls = batStats[nonStriker] ? (batStats[nonStriker].Balls || 0) : 0;

        let p1Line = `• ${striker}${isS1Striker ? '*' : ''} - ${s1Runs}(${s1Balls})`;
        let p2Line = `• ${nonStriker}${!isS1Striker ? '*' : ''} - ${s2Runs}(${s2Balls})`;
        document.getElementById('battersInfo').innerHTML = `${p1Line}<br>${p2Line}`;

        let bowlStats = matchData.BowlerStats || {};
        let bObj = bowlStats[bowler] || {};
        let bRuns = bObj.Runs || 0;
        let bWickets = bObj.Wickets || 0;
        let bBallsCount = bObj.Balls || 0;
        let bOv = Math.floor(bBallsCount / 6);
        let bBl = bBallsCount % 6;
        document.getElementById('bowlerInfo').innerHTML = `Bowler:<br>${bowler} (${bOv}.${bBl}-${bWickets})`;

        let overBallsStr = matchData.OverBalls || "";
        let ballsContainer = document.getElementById('ballsContainer');
        ballsContainer.innerHTML = '';
        if (overBallsStr) {
            let ballArray = overBallsStr.split(',');
            ballArray.forEach(ball => {
                if (ball.trim()) {
                    let span = document.createElement('span');
                    span.className = 'ball-circle';
                    span.innerText = ball;
                    if (ball.includes('W') || ball.includes('RO')) span.style.background = '#B91C1C';
                    else if (ball.includes('4')) span.style.background = '#1D4ED8';
                    else if (ball.includes('6')) span.style.background = '#7E22CE';
                    else if (ball.includes('wd') || ball.includes('nb')) span.style.background = '#C2410C';
                    else span.style.background = '#334155';
                    ballsContainer.appendChild(span);
                }
            });
        }
    }
</script>

</body>
</html>
