<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchBuzz: Semi Finals - Live Matches</title>
    <style>
        body { font-family: Arial, sans-serif; background: #FFF3E0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; padding-bottom: 30px; }
        .nav-buttons { display: flex; gap: 20px; align-items: center; margin-bottom: 10px; grid-column: 1 / -1; }
        .back-btn { background: transparent; color: #E65100; border: none; font-size: 26px; font-weight: bold; cursor: pointer; margin-left: -5px; padding: 0; }
        .extra-nav-btn { background: transparent; color: #E65100; border: 1px solid #000000; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-qtr { padding: 6px 28px; }
        .tour-banner { background: #E65100; border: 3px solid #FFB300; border-radius: 16px; padding: 25px 30px; text-align: center; margin-bottom: 20px; grid-column: 1 / -1; }
        .tour-badge { color: #FFE082; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        .tour-banner h2 { margin: 0; color: #FFFFFF; font-size: 21px; }
        .page-title { text-align: center; color: #BF360C; font-size: 22px; font-weight: bold; margin-bottom: 20px; grid-column: 1 / -1; }
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #FFFFFF; border: 2px solid #F57C00; border-radius: 16px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .match-title { color: #E65100; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .winner-banner { background: linear-gradient(to right, #FF8F00, #FFD54F); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .winner-label { color: #3E2723; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .winner-name { color: #1A237E; font-size: 20px; font-weight: bold; margin: 0; }
        .team-box { background: #FFF3E0; border: 1px solid #FFE082; border-radius: 12px; padding: 15px; text-align: center; color: #E65100; font-size: 18px; font-weight: bold; margin: 5px 0; }
        .vs-text { text-align: center; color: #D32F2F; font-size: 13px; font-weight: bold; margin: 5px 0; }
        .action-btn { width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 13px; font-weight: bold; color: #FFFFFF; cursor: pointer; margin-top: 15px; }
        .next-btn { grid-column: 1 / -1; width: 100%; border: none; border-radius: 16px; padding: 25px; font-size: 15px; font-weight: bold; color: #FFFFFF; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div style="text-align: center; color: #666; padding: 40px; grid-column: 1 / -1;">Loading Semi Finals...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMDdv0RET-RWY7M6uV376S1EI6CoPTY2o",
        authDomain: "cricket-scoring-a.firebaseapp.com",
        databaseURL: "https://cricket-scoring-a-default-rtdb.firebaseio.com",
        projectId: "cricket-scoring-a",
        storageBucket: "cricket-scoring-a.firebasestorage.app",
        messagingSenderId: "695009872829",
        appId: "1:695009872829:web:80a58e4841761bdcc3e0d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const tourKey = urlParams.get('tour') || 'Tour_0';

    const tourRef = ref(db, `Tournaments/${tourKey}`);
    onValue(tourRef, (snapshot) => {
        const container = document.getElementById('mainContainer');
        container.innerHTML = '';

        let tName = "TOURNAMENT";
        let matches = {};
        let sfWinners = {};

        if (snapshot.exists()) {
            let data = snapshot.val();
            tName = data.T_Name || tourKey;
            matches = data.Matches || {};
            if (data.SemiFinal_Winner_0) sfWinners[0] = data.SemiFinal_Winner_0;
            if (data.SemiFinal_Winner_1) sfWinners[1] = data.SemiFinal_Winner_1;
        }

        let navContainer = document.createElement('div');
        navContainer.className = 'nav-buttons';

        let btnBack = document.createElement('button');
        btnBack.className = 'back-btn';
        btnBack.innerHTML = '← Back';
        btnBack.onclick = () => window.location.href = `quater.html?tour=${tourKey}`;
        navContainer.appendChild(btnBack);

        let btnQtr = document.createElement('button');
        btnQtr.className = 'extra-nav-btn btn-qtr';
        btnQtr.innerHTML = 'QTR';
        btnQtr.onclick = () => window.location.href = `quater.html?tour=${tourKey}`;
        navContainer.appendChild(btnQtr);

        let btnLive = document.createElement('button');
        btnLive.className = 'extra-nav-btn';
        btnLive.innerHTML = 'Live matches';
        btnLive.onclick = () => window.location.href = 'index.html';
        navContainer.appendChild(btnLive);

        container.appendChild(navContainer);

        let tourBanner = document.createElement('div');
        tourBanner.className = 'tour-banner';
        tourBanner.innerHTML = `<div class="tour-badge">★ SEMI FINALS ★</div><h2>${tName.toUpperCase()}</h2>`;
        container.appendChild(tourBanner);

        let pageTitle = document.createElement('div');
        pageTitle.className = 'page-title';
        pageTitle.innerHTML = 'SEMI FINAL - LIVE MATCHES';
        container.appendChild(pageTitle);

        let gridContainer = document.createElement('div');
        gridContainer.className = 'matches-grid';

        let allSFDone = true;
        let nextTeams = [];

        for (let i = 0; i < 2; i++) {
            let realMatchIndex = 200 + i;
            let matchKey = "Match_" + realMatchIndex;
            let mData = matches[matchKey] || {};
            let team1 = mData.Team1 || "TBD";
            let team2 = mData.Team2 || "TBD";
            let winner = sfWinners[i] || mData.Winner || "";
            let isOver = mData.IsOver || false;

            if (winner) {
                nextTeams.push(winner);
            }

            if (!winner && !isOver) {
                allSFDone = false;
            }

            let card = document.createElement('div');
            card.className = 'card';

            let cardHtml = `<div class="match-title">Semi Final ${i + 1}</div>`;

            if (winner) {
                cardHtml += `
                    <div class="winner-banner">
                        <div class="winner-label">🏆 WINNER 🏆</div>
                        <h2 class="winner-name">${winner}</h2>
                    </div>
                `;
            }

            cardHtml += `
                <div>
                    <div class="team-box">${team1}</div>
                    <div class="vs-text">Vs</div>
                    <div class="team-box">${team2}</div>
                </div>
            `;

            let btnBg = '#78909C';
            let btnText = 'ENTER SCORE BOARD (Not started)';
            if (winner || isOver) {
                btnBg = '#2E7D32';
                btnText = 'MATCH SUMMARY';
            } else if (mData.Runs !== undefined || mData.BatTeam) {
                btnBg = '#C2185B';
                btnText = 'WATCH LIVE';
            }

            cardHtml += `<button class="action-btn" style="background: ${btnBg};">${btnText}</button>`;
            card.innerHTML = cardHtml;

            card.querySelector('.action-btn').onclick = () => {
                window.location.href = `score.html?tour=${tourKey}&match=${realMatchIndex}&stage=Semi Final Match`;
            };

            gridContainer.appendChild(card);
        }

        container.appendChild(gridContainer);

        let btnNextRound = document.createElement('button');
        btnNextRound.className = 'next-btn';
        btnNextRound.style.background = allSFDone ? '#2E7D32' : '#546E7A';
        btnNextRound.innerHTML = allSFDone ? '➡️ Proceed to Final' : '🔒 Proceed to Final (Complete all matches)';
        
        btnNextRound.onclick = () => {
            if (allSFDone) {
                let query = `tour=${tourKey}&next_teams=` + encodeURIComponent(JSON.stringify(nextTeams));
                window.location.href = `final.html?${query}`;
            } else {
                alert('Please finish all matches in this round!');
            }
        };

        container.appendChild(btnNextRound);
    });
</script>

</body>
</html>
